<main>
  <h1>Ajoute un article</h1>
  <form [formGroup]="f">
    <label>
      <span>Nom</span>
      <input type="text" formControlName="name" appAutofocus="select" />
      <span class="error-msg">{{ getErrorMsg(f.controls.name) }}</span>
    </label>
    <label>
      <span>Prix</span>
      <input type="number" formControlName="price" />
      <span class="error-msg">{{ getErrorMsg(f.controls.price) }}</span>
    </label>
    <label>
      <span>Quantité</span>
      <input type="number" formControlName="qty" />
      <span class="error-msg">{{ getErrorMsg(f.controls.qty) }}</span>
    </label>
    <div class="error">
      @if (errorMsg) {
        <span>Erreur : {{ errorMsg }}</span>
      }
    </div>
    <div class="buttons">
      <app-async-btn
        [isPrimary]="true"
        [action]="submit()"
        [icon]="faPlus"
        (setError)="setError($event)"
      >
        <span>Ajouter</span>
      </app-async-btn>
    </div>
  </form>
</main>
