<main>
  <h1>Ajoute un article</h1>
  <form [formGroup]="f" (ngSubmit)="submit()">
    <label>
      <span>Nom</span>
      <input type="text" formControlName="name" />
      <span class="error">
        <span>{{ errorService.getErrorMessage(f, "name") }}</span>
      </span>
    </label>
    <label>
      <span>Prix</span>
      <input type="number" formControlName="price" min="0" step="0.01" />
      <span class="error">
        <span>{{ errorService.getErrorMessage(f, "price") }}</span>
      </span>
    </label>
    <label>
      <span>Quantité</span>
      <input type="number" formControlName="qty" min="0" step="1" />
      <span class="error">
        <span>{{ errorService.getErrorMessage(f, "qty") }}</span>
      </span>
    </label>
    <div class="error">
      @if (errorMsg) {
        <span>Erreur : {{ errorMsg }}</span>
      }
    </div>
    <div class="buttons">
      <button class="primary" [disabled]="isAdding || f.invalid || f.pending">
        <fa-icon
          [icon]="isAdding ? faCircleNotch : faPlus"
          [spin]="isAdding"
        ></fa-icon>
        <span>Ajouter</span>
      </button>
    </div>
  </form>
</main>
